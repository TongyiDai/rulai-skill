<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="80" y="96" font-size="40" font-weight="700" fill="#111111">义理工具箱</text>
  <text x="80" y="140" font-size="20" fill="#8A8A8A">按需取用，一次深用 1–3 个，贪多则杂。The dharma toolkit.</text>

  <!-- center concept -->
  <circle cx="600" cy="400" r="58" fill="#2F6BFF"/>
  <text x="600" y="392" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">缘起</text>
  <text x="600" y="420" font-size="15" fill="#DCE8FF" text-anchor="middle">一切依条件生灭</text>

  <!-- satellites -->
  <g font-size="19" fill="#111111" text-anchor="middle">
    <line x1="600" y1="342" x2="600" y2="250" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="600" cy="235" r="42" fill="#F4F8FF" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="600" y="230" font-weight="700">无常</text>
    <text x="600" y="252" font-size="13" fill="#8A8A8A">松开「永远」</text>

    <line x1="658" y1="400" x2="770" y2="400" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="825" cy="400" r="42" fill="#F4F8FF" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="825" y="395" font-weight="700">无我</text>
    <text x="825" y="417" font-size="13" fill="#8A8A8A">破「我执」</text>

    <line x1="600" y1="458" x2="600" y2="545" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="600" cy="560" r="42" fill="#F4F8FF" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="600" y="555" font-weight="700">空</text>
    <text x="600" y="577" font-size="13" fill="#8A8A8A">破标签对立</text>

    <line x1="542" y1="400" x2="430" y2="400" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="375" cy="400" r="42" fill="#F4F8FF" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="375" y="395" font-weight="700">五蕴</text>
    <text x="375" y="417" font-size="13" fill="#8A8A8A">拆解情绪</text>

    <line x1="559" y1="358" x2="470" y2="285" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="430" cy="255" r="40" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="1.5"/>
    <text x="430" y="250" font-weight="700" fill="#555555">四谛</text>
    <text x="430" y="271" font-size="13" fill="#8A8A8A">诊断困境</text>

    <line x1="641" y1="358" x2="730" y2="285" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="770" cy="255" r="40" fill="#FAFAFA" stroke="#D8D8D8" stroke-width="1.5"/>
    <text x="770" y="250" font-weight="700" fill="#555555">慈悲</text>
    <text x="770" y="271" font-size="13" fill="#8A8A8A">化解怨恨</text>
  </g>

  <text x="80" y="638" font-size="19" fill="#111111">完整释义与<tspan fill="#2F6BFF" font-weight="700">常见误用清单</tspan>见 references/dharma_toolkit.md，吃不准时再查，不凭模糊印象硬讲。</text>
</svg>
